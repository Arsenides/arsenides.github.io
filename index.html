        <h2 class="post-title">【歌词翻译】星、燃ゆる</h2>
      </a>
      <div class="post-info">
        <span>
          2026-08-17
        </span>
        <span>
          1 分钟阅读
        </span>
        
      </div>
      
      <div class="post-abstract">
        <p>雨の夜影に 見えぬ姿 侘しくも<br />
色香を頼りて 触れる肌雪<br />
いたずらに撫で 塞がぬ唇と<br />
指くしけずる 艶髪に</p>
<p>雨夜暗影中 无形身姿 孤寂寥然<br />
循迹芳泽 触得肌肤胜雪<br />
徒然抚弄 未闭双唇<br />
光泽秀发 纤指梳过</p>
<p>剥きたる衣手<br />
露わなるのは<br />
君想う故の 星、燃ゆる</p>
<p>剥落衣袖所袒露<br />
为思君故 星辰炽燃</p>
<p>吸いて咲きつる 花模様<br />
八重の花びら 願う心は<br />
我が身一つの君&hellip;</p>

      </div>
